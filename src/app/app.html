<header class="topbar">
  <a class="brand" routerLink="/">Pedidos<span>360</span></a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/pedidos" routerLinkActive="active">Pedidos</a>
    <a routerLink="/productos" routerLinkActive="active">Productos</a>
    <a routerLink="/perfil" routerLinkActive="active">Perfil</a>
    <a routerLink="/admin" routerLinkActive="active">Administración</a>
  </nav>
  <div class="session">
    @if (auth.isAuthenticated()) {
      <span class="user">{{ auth.claims()?.usuario }}</span>
      <button class="btn ghost light" (click)="auth.logout()">Cerrar sesión</button>
    } @else {
      <button class="btn light" (click)="auth.login()">Iniciar sesión</button>
    }
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
